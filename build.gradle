plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ican.saf'
version = '0.0.1-SNAPSHOT'
description = 'saf-dashboard-bff'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    set('springCloudVersion', "2024.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "com.ican.saf:saf-dependencies:0.1.0"
    }
}

dependencies {
    implementation 'com.ican.saf.lib:saf-common-spring-boot-starter'
    implementation 'com.ican.saf.lib:saf-lib-exception-util'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-mvc'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}



tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // Explicitly tells Gradle that fonts are binary files and should never be parsed or filtered
    filesMatching(['**/*.woff', '**/*.woff2', '**/*.ttf', '**/*.eot', '**/*.svg']) { fileCopyDetails ->
        fileCopyDetails.filter { line -> line } // Returns the line untouched, bypassing token filters safely
    }
}


